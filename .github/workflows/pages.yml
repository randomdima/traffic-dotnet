name: Pages

# The browser head, published by the same csproj `qq web` publishes, and handed to GitHub Pages as a
# folder of real files. Nothing of ours runs beside it: every path the page fetches is relative to
# `document.baseURI`, so the project subpath the site is served under needs no configuration here.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, and a queued one is not cancelled: the publish is the expensive half and a
# cancelled run has already paid for it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # `RunAOTCompilation` is on in Release, which is minutes of Emscripten and the whole reason the
    # page keeps up with a 60 Hz loop.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          # The newest .NET 11 published, whatever it is: an RC until GA ships, GA and its patches after.
          # global.json rolls forward to it, and the workload below is installed for it.
          dotnet-version: '11.0.x'
          dotnet-quality: 'preview'

      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      # The AOT toolchain. The runner's SDK carries the manifest and not the packs.
      #
      # **From anywhere but the repository.** A workload install resolves against the directory it is
      # run in, and this one holds two projects — the desktop head and the browser one — so run from
      # the root it refuses to pick between them and installs nothing.
      - run: dotnet workload install wasm-tools
        working-directory: ${{ runner.temp }}

      # The world's kernels, GLSL taken to SPIR-V by glslc and on to WGSL by naga (Kernels.Web.targets). naga is
      # the version the kernels are written against, built once and kept: a cargo build of it is minutes.
      - run: sudo apt-get install -y --no-install-recommends glslc

      - uses: actions/cache@v6
        id: naga
        with:
          path: ~/.cargo/bin/naga
          key: naga-cli-30.0.1-${{ runner.os }}

      - if: steps.naga.outputs.cache-hit != 'true'
        run: cargo install naga-cli --version 30.0.1 --locked

      - run: dotnet publish traffic-dotnet.web.csproj -c Release

      - uses: actions/upload-pages-artifact@v5
        with:
          path: bin/web/Release/net11.0/publish/wwwroot

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
