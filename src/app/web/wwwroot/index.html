<!DOCTYPE html>
<html lang="en">

<head>
  <title>traffic-dotnet</title>
  <meta charset="UTF-8">
  <!-- `viewport-fit=cover` puts the canvas under a notch rather than beside it, and the browser's own
       pinch is turned off because the town has one of its own (CTL-9): a page that zoomed the glass
       under the gesture would be two zooms answering one pair of fingers. -->
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <!-- **The chain to the runtime, told to the browser rather than discovered by it.** Left to itself it
       learns of town.js and loading.js only after parsing main.js, and of the runtime only after running
       it — four round trips before the engine is asked for. These are all small; the nine megabytes
       behind dotnet.js are not preloaded, because a browser that cannot run this page should not spend
       them to find out (main.js). -->
  <link rel="modulepreload" href="main.js">
  <link rel="modulepreload" href="town.js">
  <link rel="modulepreload" href="loading.js">
  <link rel="modulepreload" href="_framework/dotnet.js">
  <script type='module' src="main.js"></script>
  <style>
    /* `overscroll-behavior` is what stops a drag down the town becoming a pull-to-refresh. */
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; overscroll-behavior: none; }
    /* The canvas is the whole page: the town's own interface is drawn inside it and there is no
       second one out here. `dvh` and not `vh`, because a phone's `vh` is the viewport with the address
       bar hidden and the canvas would stand that much off the bottom of the screen until it was.

       **`touch-action: none` is what makes any of the touch work** (CTL-9): left to itself the browser
       claims a drag as a scroll and a pinch as a zoom, and delivers neither to the page. */
    #town {
      display: block; width: 100vw; height: 100vh; height: 100dvh;
      touch-action: none; user-select: none; -webkit-user-select: none;
    }
    #banner {
      position: fixed; inset: auto 0 0 0; padding: 0.4rem 0.6rem;
      font: 13px/1.4 ui-monospace, monospace; color: #cfcfcf; background: #111;
      white-space: pre-wrap;
    }

    /* The opening, in front of the canvas until the town is standing behind it. Its colours are the
       interface's own, because it is the first thing anybody sees of them. */
    #opening {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 0.9rem;
      font: 14px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      color: #cfcfcf; background: #16181d; text-align: center; padding: 1.5rem;
    }
    #opening h1 { margin: 0; font-size: 1.6rem; font-weight: 600; color: #e8c26a; letter-spacing: 0.02em; }
    #opening p { margin: 0; }
    #opening-about { color: #8a8f98; max-width: 34rem; }
    #opening-stage { color: #cfcfcf; min-height: 1.5em; }
    #opening-detail { color: #6f747d; min-height: 1.5em; font-size: 13px; max-width: 34rem; }
    #opening-bar {
      width: min(26rem, 80vw); height: 6px; border-radius: 3px;
      background: #22262d; overflow: hidden;
    }
    #opening-fill {
      width: 0; height: 100%; border-radius: 3px; background: #4fb5a0;
      transition: width 120ms linear;
    }
    /* A stage nothing can count sweeps rather than fills: a bar that sat at nought for the whole of
       the runtime coming down would read as a page that had stopped. */
    #opening-bar.sweeping #opening-fill {
      width: 35%; transition: none; animation: sweep 1.1s ease-in-out infinite;
    }
    @keyframes sweep {
      0% { transform: translateX(-110%); }
      100% { transform: translateX(300%); }
    }
    #opening.trouble h1 { color: #d97a6c; }
    #opening.trouble #opening-stage { color: #e8a99f; }
    @media (prefers-reduced-motion: reduce) {
      #opening-bar.sweeping #opening-fill { animation: none; width: 100%; opacity: 0.4; }
    }
  </style>
</head>

<body>
  <canvas id="town"></canvas>
  <!-- What a standing town says: the shutdown, and anything the run reports once the opening is gone. -->
  <div id="banner" style="display: none"></div>
  <div id="opening">
    <h1>traffic-dotnet</h1>
    <p id="opening-about">A small town driving itself — C# on .NET&nbsp;10 over WebGPU, with no engine under it.</p>
    <div id="opening-bar" class="sweeping"><div id="opening-fill"></div></div>
    <p id="opening-stage">checking what this browser can do…</p>
    <p id="opening-detail"></p>
  </div>
</body>

</html>
